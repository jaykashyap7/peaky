<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Peaky</title><meta name="theme-color" content="#0d1014">

<style>

@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="app"><header class="row" style="padding:12px 16px 0"><button class="btn" onclick="menu()" aria-label="Menu">☰</button><b id="ht"></b><span style="width:44px"></span></header><main id="m"></main></div><div id="al"></div>
<nav id="nv"></nav><button id="fab" onclick="tform()">+ Add Trade</button><div id="sh" onclick="if(event.target==this)cl()"><div id="shc"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let db,T=[],A=[],C={theme:'auto',acct:'all',range:'month',nt:{}},tab='home',F={q:'',st:'',sym:'',sess:'',side:'',tag:''},cm=new Date(),gran='trade';
const open=()=>new Promise(r=>{try{const q=indexedDB.open('tj',1);q.onupgradeneeded=()=>['trades','accounts','kv'].forEach(n=>q.result.createObjectStore(n,{keyPath:n=='kv'?'k':'id'}));q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const io=(s,m,o)=>new Promise(r=>{try{const t=db.transaction(s,'readwrite'),x=t.objectStore(s);const q=x[m](o);t.oncomplete=()=>r(q.result);t.onerror=()=>r()}catch(e){r()}});
const getAll=s=>new Promise(r=>{try{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])}catch(e){r([])}});
const save=()=>io('kv','put',{k:'cfg',v:C});
const num=v=>v===''||v==null||isNaN(+v)?null:+v,uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const f=n=>(n<0?'-':'+')+'$'+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),f0=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString();
const cc=n=>n>0?'w':n<0?'l':'be',ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T12:00');
function range(r){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),d=n.getDate();const e=ds(n);
 if(r=='today')return[e,e];if(r=='week'){const s=new Date(y,m,d-((n.getDay()+6)%7));return[ds(s),e]}
 if(r=='month')return[ds(new Date(y,m,1)),e];if(r=='prev')return[ds(new Date(y,m-1,1)),ds(new Date(y,m,0))];
 if(r=='3m')return[ds(new Date(y,m-3,d)),e];if(r=='6m')return[ds(new Date(y,m-6,d)),e];if(r=='year')return[y+'-01-01',e];return['0000','9999']}
const RN={today:'Today',week:'This week',month:'This month',prev:'Previous month','3m':'3 months','6m':'6 months',year:'This year',all:'All time'};
const acctT=()=>T.filter(t=>C.acct=='all'||t.acct==C.acct);
const inR=(l,r)=>{const[a,b]=range(r);return l.filter(t=>t.date>=a&&t.date<=b)};
function stats(l){const R=l.filter(t=>REAL.includes(t.status)),W=R.filter(t=>t.status=='win'),L=R.filter(t=>t.status=='loss');
 const gp=W.reduce((s,t)=>s+t.pnl,0),gl=-L.reduce((s,t)=>s+t.pnl,0),tot=gp-gl,n=R.length,rs=R.filter(t=>t.r!=null),days={};
 R.forEach(t=>days[t.date]=(days[t.date]||0)+t.pnl);const dv=Object.entries(days).sort((a,b)=>a[1]-b[1]);
 return{n,W:W.length,L:L.length,B:n-W.length-L.length,wr:n?W.length/n*100:0,gp,gl,tot,pf:gl?gp/gl:(gp?Infinity:0),aw:W.length?gp/W.length:0,al:L.length?-gl/L.length:0,
 best:n?Math.max(...R.map(t=>t.pnl)):0,worst:n?Math.min(...R.map(t=>t.pnl)):0,avg:n?tot/n:0,ar:rs.length?rs.reduce((s,t)=>s+t.r,0)/rs.length:0,bd:dv.length?dv[dv.length-1]:null,wd:dv.length?dv[0]:null,
 av:l.filter(t=>t.status=='al').length,ap:l.filter(t=>t.status=='ap').length}}
const pill=s=>`<span class="pill ${ST[s][1]}">${ST[s][0]}</span>`,chips=t=>(t||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('');
const sorted=l=>[...l].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
const card=t=>`<button class="card item" onclick="detail('${t.id}')"><div class="row"><b>${esc(t.symbol)} <span class="k">${t.side=='buy'?'BUY':'SELL'}</span></b><b class="${REAL.includes(t.status)?cc(t.pnl):''}">${REAL.includes(t.status)?f(t.pnl):'—'}</b></div><div class="row" style="margin-top:6px"><span class="k">${t.date}${t.time?' · '+t.time:''}${t.session?' · '+esc(t.session):''}</span>${pill(t.status)}</div>${t.tags?.length?`<div style="margin-top:6px">${chips(t.tags)}</div>`:''}</button>`;
function curve(pts,w,h){if(!pts.length)return'';if(pts.length==1)return`<circle cx="${w/2}" cy="${h/2}" r="4" fill="currentColor"/>`;
 const mx=Math.max(...pts),mn=Math.min(...pts,0),sp=(mx-mn)||1,P=pts.map((v,i)=>[10+i*(w-20)/(pts.length-1),h-14-(v-mn)/sp*(h-28)]);let d=`M${P[0]}`;
 for(let i=0;i<P.length-1;i++){const a=P[i-1]||P[i],b=P[i],c=P[i+1],e=P[i+2]||c;d+=`C${b[0]+(c[0]-a[0])/6},${b[1]+(c[1]-a[1])/6} ${c[0]-(e[0]-b[0])/6},${c[1]-(e[1]-b[1])/6} ${c}`}
 const z=h-14-(0-mn)/sp*(h-28);return`<line x1="0" x2="${w}" y1="${z}" y2="${z}" stroke="var(--bd)" stroke-dasharray="3 4"/><path d="${d}L${P.at(-1)[0]},${z}L${P[0][0]},${z}Z" fill="currentColor" opacity=".08"/><path d="${d}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>`}
function equity(l){const R=sorted(l).reverse().filter(t=>REAL.includes(t.status));let b=[],k=t=>t.date;
 if(gran=='weekly')k=t=>{const d=pd(t.date);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)};if(gran=='monthly')k=t=>t.date.slice(0,7);
 if(gran=='trade')b=R.map(t=>t.pnl);else{const o={};R.forEach(t=>o[k(t)]=(o[k(t)]||0)+t.pnl);b=Object.keys(o).sort().map(x=>o[x])}
 let s=0;const pts=b.map(v=>s+=v),col=(pts.at(-1)||0)>=0?'var(--w)':'var(--l)';
 return`<div class="seg" style="margin:10px 0 6px">${[['trade','Trades'],['daily','Daily'],['weekly','Weekly'],['monthly','Monthly']].map(([a,n])=>`<span class="chip ${gran==a?'on':''}" onclick="gran='${a}';go()">${n}</span>`).join('')}</div>${pts.length?`<svg viewBox="0 0 340 150" style="width:100%;color:${col}">${curve(pts,340,150)}</svg>`:'<p class="k" style="padding:30px 0;text-align:center">The curve appears after your first closed trade.</p>'}`}
function rsel(){return`<select style="width:auto;font-size:13px;padding:6px 10px" onchange="C.range=this.value;save();go()">${Object.entries(RN).map(([k,v])=>`<option value="${k}" ${C.range==k?'selected':''}>${v}</option>`).join('')}<option disabled>Custom range: coming soon</option></select>`}
function asel(){return`<select style="width:auto;font-size:13px;padding:6px 10px" onchange="C.acct=this.value;save();go()"><option value="all">All accounts</option>${A.map(a=>`<option value="${a.id}" ${C.acct==a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`}
const empty=`<div class="empty"><p>No trades yet</p><p>Your trading journey starts here.</p><br><button class="btn p" onclick="tform()">+ Add your first trade</button></div>`;
const stat=(k,v,c='')=>`<div class="card"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`;
const pf=x=>x===Infinity?'∞':x.toFixed(2);
function home(){const L=inR(acctT(),C.range),s=stats(L);return`${plan()}<div class="sel2">${asel()}${rsel()}</div><h1 style="margin-top:14px">${RN[C.range]}</h1><div class="big ${cc(s.tot)}" style="margin:10px 0 4px">${f(s.tot)}</div><div class="k">${s.n} closed trades · ${s.av} avoided losses · ${s.ap} avoided profits</div>
<div class="g" style="margin-top:14px">${stat('Win rate',s.wr.toFixed(1)+'%')}${stat('Trades',s.n)}${stat('Profit factor',pf(s.pf))}${stat('Avg win',f0(s.aw),'w')}${stat('Avg loss',f0(s.al),'l')}${stat('Avg R',s.ar.toFixed(2)+'R')}</div>
<h2>Equity curve</h2><div class="card">${equity(L)}</div><h2>Recent</h2>${acctT().length?sorted(acctT()).slice(0,4).map(card).join(''):empty}`}
function journal(){let l=acctT();const q=F.q.toLowerCase();
 l=l.filter(t=>(!F.st||t.status==F.st)&&(!F.sym||t.symbol==F.sym)&&(!F.sess||t.session==F.sess)&&(!F.side||t.side==F.side)&&(!F.tag||(t.tags||[]).includes(F.tag))&&(!F.mood||t.mood==F.mood)&&(!F.emo||t.emo==F.emo)&&(!F.conf||t.conf==F.conf)&&(!q||[t.symbol,t.date,t.session,t.side,t.status,ST[t.status][0],t.pnl,...(t.tags||[]),t.why,t.mood,t.emo,t.conf].join(' ').toLowerCase().includes(q)));
 const act=Object.values(F).filter(Boolean).length-(F.q?1:0);
 return`<div class="row"><h2 style="margin:0">Journal</h2>${asel()}</div><div class="row" style="margin:12px 0"><input placeholder="Search symbol, tag, session, date…" value="${esc(F.q)}" oninput="F.q=this.value;lst()"><button class="btn" onclick="filt()">Filters${act?' ('+act+')':''}</button></div>
<div class="seg" style="margin-bottom:10px">${[['','All'],['win','Wins'],['loss','Losses'],['be','Breakeven'],['al','Avoided loss'],['ap','Avoided profit']].map(([k,n])=>`<span class="chip ${F.st==k?'on':''}" onclick="F.st='${k}';go()">${n}</span>`).join('')}</div><div id="ls">${listH(l)}</div>`}
const listH=l=>!T.length?empty:!l.length?'<div class="empty"><p>No matches</p><p>Try clearing a filter.</p></div>':sorted(l).slice(0,300).map(card).join('');
function lst(){const q=F.q;go(1)}
function go(keep){const m=$('#m'),y=m.scrollTop,fo=document.activeElement,id=fo&&fo.tagName=='INPUT'&&fo.closest('#m');render();if(keep&&id){const i=$('#m input');i.focus();i.setSelectionRange(99,99)}m.scrollTop=y}
function cal(){const y=cm.getFullYear(),mo=cm.getMonth(),l=acctT().filter(t=>t.date.startsWith(y+'-'+String(mo+1).padStart(2,'0'))),first=(new Date(y,mo,1).getDay()+6)%7,nd=new Date(y,mo+1,0).getDate(),by={};
 l.forEach(t=>(by[t.date]=by[t.date]||[]).push(t));let c='';for(let i=0;i<first;i++)c+='<div></div>';
 for(let d=1;d<=nd;d++){const k=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),x=by[k]||[],R=x.filter(t=>REAL.includes(t.status)),p=R.reduce((s,t)=>s+t.pnl,0);
  const col=R.length?(p>0?'var(--w)':p<0?'var(--l)':'var(--b)'):'',av=x.some(t=>t.status=='al')?'var(--al)':x.some(t=>t.status=='ap')?'var(--ap)':C.nt[k]?'var(--mu)':'';
  c+=`<div class="cd" onclick="day('${k}')" style="${col?`background:color-mix(in srgb,${col} 16%,var(--card));border-color:color-mix(in srgb,${col} 45%,var(--bd));color:var(--tx)`:''}">${d}${R.length?`<b style="color:${col}">${f0(p)}</b>`:''}${av?`<i class="dot" style="background:${av}"></i>`:''}</div>`}
 const s=stats(l),dc=Object.keys(by).length;
 return`<div class="row"><h2 style="margin:0">${cm.toLocaleString(undefined,{month:'long',year:'numeric'})}</h2><div class="row"><button class="btn" onclick="cm.setMonth(cm.getMonth()-1);go()">‹</button><button class="btn" onclick="cm.setMonth(cm.getMonth()+1);go()">›</button></div></div><div class="row" style="margin:6px 0 12px"><b class="${cc(s.tot)}" style="font-size:22px">${f(s.tot)}</b>${asel()}</div>
<div class="cal" style="margin-bottom:5px">${'MTWTFSS'.split('').map(x=>`<div class="k" style="text-align:center">${x}</div>`).join('')}</div><div class="cal">${c}</div>
<div class="k" style="margin-top:12px"><span class="w">● Win</span> &nbsp;<span class="l">● Loss</span> &nbsp;<span class="be">● Breakeven</span> &nbsp;<span class="al">● Avoided loss</span> &nbsp;<span class="ap">● Avoided profit</span></div><div class="k" style="margin-top:6px">${dc} active days · ${s.av} avoided losses · ${s.ap} avoided profits</div>`}
function day(k){const l=sorted(acctT().filter(t=>t.date==k));sh(`<div class="row"><h2 style="margin:0">${k}</h2><button class="btn" onclick="cl()">Close</button></div><div style="margin:12px 0">${l.map(card).join('')||'<p class="k">A quiet day, and that is fine.</p>'}</div><div class="row"><button class="btn p" onclick="cl();tform(null,'${k}')">+ Add trade</button><button class="btn" onclick="C.nt['${k}']=!C.nt['${k}'];save();cl();go()">${C.nt[k]?'✓ Stayed disciplined (undo)':'No trade — stayed disciplined'}</button></div>`)}
function brk(l,key,multi){const o={};l.filter(t=>REAL.includes(t.status)).forEach(t=>(multi?t.tags||[]:[t[key]||'—']).forEach(g=>{o[g]=o[g]||{p:0,n:0,w:0};o[g].p+=t.pnl;o[g].n++;o[g].w+=t.status=='win'}));
 const e=Object.entries(o).sort((a,b)=>b[1].p-a[1].p),mx=Math.max(1,...e.map(x=>Math.abs(x[1].p)));
 return e.length?e.map(([k,v])=>`<div style="margin-bottom:12px"><div class="row"><span>${esc(k)} <span class="k">${v.n} trades · ${(v.w/v.n*100).toFixed(0)}% win</span></span><b class="${cc(v.p)}">${f0(v.p)}</b></div><div class="bar" style="width:${Math.abs(v.p)/mx*100}%;background:var(--${v.p>=0?'w':'l'})"></div></div>`).join(''):'<p class="k">No data yet.</p>'}
function analytics(){const l=inR(acctT(),C.range),s=stats(l),all=acctT(),n=new Date(),ms=[];

async function rest(merge){const d=window.BK;if(!merge){for(const t of T)await io('trades','delete',t.id);for(const a of A)await io('accounts','delete',a.id);T=[];A=[]}
 for(const a of d.accounts)if(!A.find(x=>x.id==a.id)){A.push(a);await io('accounts','put',a)}for(const t of d.trades){await io('trades','put',t);T=T.filter(x=>x.id!=t.id);T.push(t)}Object.assign(C.nt,d.settings?.nt||{});if(d.settings?.al)C.al=d.settings.al;if(d.settings?.plans)C.plans={...C.plans,...d.settings.plans};C.acct='all';save();cl();go()}
function reset(){conf('This permanently erases every trade, account and screenshot on this device. Export a backup first.',()=>conf('Last check: erase everything?',async()=>{for(const t of T)await io('trades','delete',t.id);for(const a of A)await io('accounts','delete',a.id);T=[];A=[];await boot2();go()}))}
async function boot2(){const a={id:uid(),name:'Main'};A=[a];await io('accounts','put',a)}

const MOODS=['Calm','Confident','Focused','Neutral','Tired','Anxious','Angry','Sad','Overexcited'],EMOS=['Patient','Fear','Greed','FOMO','Revenge','Hope','Regret','Frustrated','Satisfied'],CONFS=['Clear','Slightly confused','Very confused'];
const ms=(id,a,v)=>`<select id="${id}"><option value="">—</option>${a.map(x=>`<option ${v==x?'selected':''}>${x}</option>`).join('')}</select>`;
const mc=t=>{const a=[t.mood&&'Mood: '+t.mood,t.emo&&'Emotion: '+t.emo,t.conf&&'Confusion: '+t.conf].filter(Boolean);return a.length?`<div style="margin-top:8px">${chips(a)}</div>`:''};
const moodIns=l=>{const out=[];[['mood','mood'],['emo','emotion'],['conf','confusion']].forEach(([k,n])=>{const o={};l.filter(t=>REAL.includes(t.status)&&t[k]).forEach(t=>{const g=o[t[k]]=o[t[k]]||{p:0,n:0,w:0};g.p+=t.pnl;g.n++;g.w+=t.status=='win'});const e=Object.entries(o).sort((a,b)=>a[1].p-b[1].p);if(e.length&&e[0][1].p<0)out.push(`Worst ${n}: <b>${esc(e[0][0])}</b> ${f0(e[0][1].p)} over ${e[0][1].n} trades (${(e[0][1].w/e[0][1].n*100).toFixed(0)}% win)`)});return out.length?out.map(x=>`<p style="margin-bottom:6px">${x}</p>`).join(''):'<p class="k">Add mood and emotion to your trades to see which feelings cost you money.</p>'};
const today=()=>ds(new Date());
const PLC={},PL=n=>{try{if(PLC[n])return PLC[n];const K=window.Capacitor;if(!K||!(K.isNativePlatform&&K.isNativePlatform()))return null;return PLC[n]=(K.Plugins&&K.Plugins[n])||(K.registerPlugin?K.registerPlugin(n):null)}catch(e){return null}};
const gp=d=>(C.plans||{})[d]||{};
function plan(){const p=gp(today()),ck=p.items||[],dn=p.done||{};
 if(!p.rule&&!p.confirm&&!p.note&&!p.target&&!p.rr&&!ck.length)return`<button class="card item" onclick="planEd()"><b>Today's plan</b><div class="k">New day, fresh plan. Tap to write your rule, confirmation, target and R:R.</div></button>`;
 return`<div class="card" style="margin-bottom:14px"><div class="row"><b>Today's plan</b><button class="btn" style="padding:4px 10px" onclick="planEd()">Edit</button></div>${[['Rule',p.rule],['Confirmation',p.confirm],['Note',p.note]].filter(x=>x[1]).map(([k,v])=>`<div style="margin-top:8px"><span class="k">${k}</span><div style="white-space:pre-wrap">${esc(v)}</div></div>`).join('')}${p.target||p.rr?`<div style="margin-top:10px">${p.target?`<span class="chip">Target: ${esc(p.target)}</span>`:''}${p.rr?`<span class="chip">R:R ${esc(p.rr)}</span>`:''}</div>`:''}${ck.map((x,i)=>`<label style="display:flex;gap:10px;align-items:center;margin:8px 0 0;font-size:14px;color:var(--tx)"><input type="checkbox" style="width:20px;height:20px" ${dn[i]?'checked':''} onchange="tick(${i},this.checked)">${esc(x)}</label>`).join('')}</div>`}
function tick(i,c){const d=today();C.plans=C.plans||{};const p=C.plans[d]=C.plans[d]||{};p.done=p.done||{};p.done[i]=c;save();dirty();wgt()}
function planEd(d){d=d||today();const p=gp(d),v=k=>esc(p[k]||''),ex=Object.keys(C.plans||{}).some(k=>k<d);sh(`<div class="row"><h2 style="margin:0">${d==today()?"Today's plan":'Plan · '+d}</h2><button class="btn" onclick="cl()">Close</button></div>${ex&&!p.rule&&!p.items?`<button class="btn" style="width:100%;margin-top:10px" onclick="planCopy('${d}')">Copy my last plan</button>`:''}<label>Rule</label><textarea id="pr">${v('rule')}</textarea><label>Confirmation</label><textarea id="pc">${v('confirm')}</textarea><label>Note</label><textarea id="pn">${v('note')}</textarea><div class="g g2"><div><label>Target</label><input id="pt" value="${v('target')}" placeholder="$200"></div><div><label>R:R</label><input id="pq" value="${v('rr')}" placeholder="1:3"></div></div><label>Rules to follow (one per line, tick them on Home)</label><textarea id="pk">${esc((p.items||[]).join('\n'))}</textarea><button class="btn p" style="width:100%;margin-top:14px" onclick="planSave('${d}')">Save plan</button>
<h2>Quick R:R check (outside trade)</h2><div class="g"><div><label>Entry</label><input id="qe" type="number" inputmode="decimal" step="any" oninput="qr()"></div><div><label>Stop</label><input id="qs" type="number" inputmode="decimal" step="any" oninput="qr()"></div><div><label>Target</label><input id="qt" type="number" inputmode="decimal" step="any" oninput="qr()"></div></div><div id="qo" class="card" style="margin-top:10px">Enter entry, stop loss and target.</div>`)}
function planCopy(d){const ks=Object.keys(C.plans||{}).filter(k=>k<d).sort();if(!ks.length)return;C.plans[d]={...C.plans[ks.at(-1)],done:{}};planEd(d)}
function planSave(d){const g=i=>$('#'+i).value.trim(),it=g('pk').split('\n').map(x=>x.trim()).filter(Boolean);C.plans=C.plans||{};const o=C.plans[d]||{};C.plans[d]={rule:g('pr'),confirm:g('pc'),note:g('pn'),target:g('pt'),rr:g('pq'),items:it,done:JSON.stringify(o.items)==JSON.stringify(it)?o.done||{}:{}};save();dirty();wgt();cl();go()}
function planHist(){const ks=Object.keys(C.plans||{}).sort().reverse();sh(`<div class="row"><h2 style="margin:0">Plan history</h2><button class="btn" onclick="cl()">Close</button></div><div style="margin-top:12px">${ks.map(k=>{const p=C.plans[k],n=(p.items||[]).length,dn=Object.values(p.done||{}).filter(Boolean).length;return`<button class="card item" onclick="planEd('${k}')"><div class="row"><b>${k}</b><span class="k">${n?dn+'/'+n+' followed':''}</span></div><div class="k" style="white-space:pre-wrap">${esc((p.rule||p.note||'').slice(0,90))}</div></button>`}).join('')||'<p class="k">No plans saved yet.</p>'}</div>`)}
function wgt(){const W=PL('PeakyWidget');if(!W)return;const p=gp(today()),dn=p.done||{},L=[];if(p.rule)L.push('Rule: '+p.rule);if(p.confirm)L.push('Confirm: '+p.confirm);if(p.target||p.rr)L.push([p.target&&'Target '+p.target,p.rr&&'R:R '+p.rr].filter(Boolean).join(' · '));if(p.note)L.push('Note: '+p.note);(p.items||[]).forEach((x,i)=>L.push((dn[i]?'☑ ':'☐ ')+x));try{W.update({text:L.join('\n'),date:today()})}catch(e){}}
let abT;function autoBk(n){clearTimeout(abT);abT=setTimeout(async()=>{const B=PL('PeakyBackup');if(!B){if(n){C.bkErr='Phone folder backup works in the installed Peaky app only.';go()}return}if(!T.length){if(n){C.bkErr='No trades to back up yet.';go()}return}try{const r=await B.save({name:'Peaky_Backup_'+today()+'.json',data:snap()});C.lastFile=r.path+' at '+new Date().toLocaleTimeString();C.bkErr='';C.pending=false;save()}catch(e){C.bkErr='Could not save: '+((e&&e.message)||e);save()}if(tab=='settings')go()},n?0:2500)}
function qr(){const g=i=>num($('#'+i).value),e=g('qe'),s=g('qs'),t=g('qt'),o=$('#qo'),P=gp(today());if(e==null||s==null||t==null||e==s){o.textContent='Enter entry, stop loss and target.';return}
 if(!((e>s&&t>e)||(e<s&&t<e))){o.innerHTML='<span class="l">Stop and target must be on opposite sides of entry.</span>';return}
 const rr=Math.abs(t-e)/Math.abs(e-s),need=parseFloat(String(P.rr||'').split(':').pop()),ok=need?rr>=need:null;
 o.innerHTML=`<b>R:R 1:${rr.toFixed(2)}</b> · ${e>s?'Buy':'Sell'}<div class="k">Risk ${Math.abs(e-s).toFixed(2)} · Reward ${Math.abs(t-e).toFixed(2)}</div>${ok==null?'':ok?'<div class="w">Meets your '+esc(P.rr)+' rule</div>':'<div class="l">Below your '+esc(P.rr)+' rule. Skip it or improve it.</div>'}`}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){wgt();if(tab=='home')go()}});
function menu(){sh(`<div class="row"><h2 style="margin:0">Menu</h2><button class="btn" onclick="cl()">Close</button></div><div style="margin-top:14px"><button class="card item" onclick="alarms()"><b>Session alarms</b><div class="k">${(C.al||[]).filter(a=>a.on).length} active · candle-check reminders</div></button><button class="card item" onclick="planEd()"><b>Today's plan</b><div class="k">Rule, confirmation, target, R:R, checklist, quick R:R check</div></button><button class="card item" onclick="planHist()"><b>Plan history</b><div class="k">Past days: rules and what you followed</div></button><button class="card item" onclick="cl();tab='settings';render()"><b>Settings &amp; backup</b></button></div>`)}
function alarms(){const L=C.al||[],D=['Su','Mo','Tu','We','Th','Fr','Sa'];sh(`<div class="row"><h2 style="margin:0">Session alarms</h2><button class="btn" onclick="cl()">Close</button></div><p class="k" style="margin:8px 0 12px">Alarms ring while the app is open on your phone. Set a phone Clock alarm as a backup.</p>
${L.map(a=>`<div class="card" style="margin-bottom:8px"><div class="row"><b>${esc(a.label)}</b><span class="${a.on?'w':'k'}" onclick="togAl('${a.id}')" style="cursor:pointer;font-weight:700">${a.on?'On':'Off'}</span></div><div>${a.t}${a.e?' – '+a.e:''}</div><div class="k">${a.days.map(d=>D[d]).join(' ')}${a.msg?' · '+esc(a.msg):''}</div><button class="btn d" style="margin-top:8px;padding:4px 10px" onclick="conf('Delete this alarm?',()=>delAl('${a.id}'))">Delete</button></div>`).join('')||'<p class="k">No alarms yet.</p>'}
<h2>New alarm</h2><label>Label</label><input id="al1" placeholder="London session candle check"><div class="g g2"><div><label>Starts at</label><input id="al2" type="time" value="12:43"></div><div><label>Ends at (optional)</label><input id="al3" type="time" value="12:58"></div></div><label>Message</label><input id="al4" value="Check the candle so you don't miss the trade"><label>Repeat on</label><div>${[1,2,3,4,5,6,0].map(d=>`<label class="chip" style="display:inline-flex;gap:4px;align-items:center;color:var(--tx);margin:2px 4px 2px 0"><input type="checkbox" class="dy" value="${d}" ${d&&d<6?'checked':''} style="width:auto">${D[d]}</label>`).join('')}</div>
<button class="btn p" style="width:100%;margin-top:14px" onclick="addAl()">Add alarm</button><button class="btn" style="width:100%;margin-top:8px" onclick="testAl()">Allow notifications and test sound</button>`)}
function addAl(){const g=i=>$('#'+i).value.trim(),t=g('al2');if(!t)return;C.al=C.al||[];C.al.push({id:uid(),label:g('al1')||'Candle check',t,e:g('al3'),msg:g('al4'),days:[...document.querySelectorAll('.dy:checked')].map(x=>+x.value),on:true});save();nsch();alarms()}
function togAl(id){const a=C.al.find(x=>x.id==id);a.on=!a.on;save();nsch();alarms()}
function delAl(id){C.al=C.al.filter(x=>x.id!=id);save();nsch();alarms()}
async function nsch(){const L=PL('LocalNotifications');if(!L)return;try{const p=await L.requestPermissions();if(p.display!='granted')return;await L.createChannel({id:'alarm',name:'Session alarms',importance:5,vibration:true,visibility:1});const q=await L.getPending();if(q.notifications.length)await L.cancel({notifications:q.notifications});const out=[];let i=1;(C.al||[]).filter(a=>a.on).forEach(a=>a.days.forEach(d=>[['s',a.t],['e',a.e]].forEach(([k,t])=>{if(!t)return;const [h,m]=t.split(':');out.push({id:i++,channelId:'alarm',title:k=='e'?'Window closing: '+a.label:a.label,body:k=='e'?'Last chance to check the setup.':(a.msg||'Check the candle.'),schedule:{on:{weekday:d+1,hour:+h,minute:+m},allowWhileIdle:true}})})));if(out.length)await L.schedule({notifications:out})}catch(e){}}
const FI={};let AC;
function beep(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();[0,.35,.7].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+d);o.stop(AC.currentTime+d+.2)})}catch(e){}}
function testAl(){nsch();try{Notification.requestPermission()}catch(e){}beep();navigator.vibrate&&navigator.vibrate(300)}
function ring(a,k){const n=k=='e'?'Window closing: '+a.label:a.label,m=k=='e'?'Last chance to check the setup.':(a.msg||'Check the candle.');beep();navigator.vibrate&&navigator.vibrate([400,150,400,150,800]);try{if(Notification.permission=='granted')new Notification(n,{body:m})}catch(e){}
 $('#al').innerHTML=`<div class="card" style="border-color:var(--b);box-shadow:0 8px 30px rgba(0,0,0,.35)"><b style="font-size:16px">⏰ ${esc(n)}</b><p style="margin:4px 0 10px">${esc(m)}</p><div class="row"><button class="btn" onclick="snz('${a.id}')">Snooze 5 min</button><button class="btn p" onclick="$('#al').innerHTML=''">Dismiss</button></div></div>`}
function snz(id){$('#al').innerHTML='';setTimeout(()=>ring((C.al||[]).find(x=>x.id==id)||{label:'Alarm',msg:''},'s'),3e5)}
function chk(){const n=new Date(),nm=n.getHours()*60+n.getMinutes(),d0=ds(n);(C.al||[]).filter(a=>a.on&&a.days.includes(n.getDay())).forEach(a=>[['s',a.t],['e',a.e]].forEach(([k,t])=>{if(!t)return;const [h,m]=t.split(':'),tm=+h*60+ +m,key=a.id+k+d0;if(nm>=tm&&nm-tm<=2&&!FI[key]){FI[key]=1;ring(a,k)}}))}
document.addEventListener('click',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}},{once:true});
(async()=>{await open();const k=(await getAll('kv')).find(x=>x.k=='cfg');if(k)Object.assign(C,k.v);T=await getAll('trades');A=await getAll('accounts');if(!A.length)await boot2();
 const today=ds(new Date());C.bk=C.bk||{};if(!C.bk[today]&&T.length){C.bk[today]=T.length+' trades';await io('kv','put',{k:'bk_'+today,v:snap()});Object.keys(C.bk).sort().slice(0,-7).forEach(x=>{delete C.bk[x];io('kv','delete','bk_'+x)});C.lastBackup='Today';await save()}
 if(C.plan&&!C.plans){C.plans={[C.plan.day||ds(new Date(Date.now()-864e5))]:{...C.plan}};delete C.plan;save()}thm();nsch();wgt();autoBk();setInterval(chk,10000);document.addEventListener('visibilitychange',chk)})();
</script></body></html>
